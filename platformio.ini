; PlatformIO project configuration. Run from PowerShell or cmd, not Git Bash.
;   pio run -e Release                build the firmware
;   pio run -e Release -t uploadfs    upload the web pages in data/ to LittleFS
;   pio run -e Release -t upload      upload the firmware
[platformio]

; Keep this project's platform packages isolated from other ESP32 projects.
packages_dir = ${platformio.core_dir}/ESP32-Network-Base


[env]
platform = espressif32@7.1.3
board = freenove_esp32_wrover
framework = arduino
board_build.mcu = esp32
board_build.f_cpu = 240000000L
upload_port = COM20
upload_speed = 921600
monitor_port = COM20
monitor_speed = 115200
test_port = COM20

; Avoid extra analysis packages that can break PlatformIO's Inspect task.
check_skip_packages = yes

; Avoid deep+; it can fail to locate Arduino Network headers.
lib_ldf_mode = chain

; Remove the default C++11 flag so the C++17 build flag below takes effect.
build_unflags = -std=gnu++11

lib_deps =
	esp32async/ESPAsyncWebServer@^3.12.1
	esp32async/AsyncTCP@^3.5.0
	bblanchon/ArduinoJson@^7.4.2

; Run the web asset packer before compilation.
extra_scripts = pre:scripts/pack_files.py
se
; Use the custom 4 MB flash layout: about 1.9 MB each for the firmware and the data partition.
board_build.partitions = defpart.csv
; Mount the data partition as LittleFS for the web pages.
board_build.filesystem = littlefs

; AsyncTCP: 5 s ACK timeout, priority 10 on core 1, queue 64, 8 KB stack, 1 KB receive window.
; Regex routes are unused, so keep ASYNCWEBSERVER_REGEX disabled.
build_flags =
	-std=gnu++17
	-D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
	-D CONFIG_ASYNC_TCP_PRIORITY=10
	-D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
	-D CONFIG_ASYNC_TCP_RUNNING_CORE=1
	-D CONFIG_ASYNC_TCP_STACK_SIZE=8192
	-D CONFIG_ASYNC_TCP_RECEIVE_WINDOW=1024

[env:Release]
build_type = release

[env:Debug]
build_type = debug
; Translates crash backtraces on the serial monitor into function names and source lines.
monitor_filters = esp32_exception_decoder
; Most verbose ESP-IDF/Arduino logging on the serial console.
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=5 -DAPP_SERIAL_LOGGING=1
